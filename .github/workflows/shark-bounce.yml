name: Build Shark Bounce APK

on:
  push:
    branches: [main]
    paths:
      - "shark-bounce/**"
      - ".github/workflows/shark-bounce.yml"
  pull_request:
    paths:
      - "shark-bounce/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shark-bounce
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk SharkBounce.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SharkBounce-apk
          path: shark-bounce/SharkBounce.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shark-bounce-v1.0.${{ github.run_number }}
          name: Shark Bounce 1.0.${{ github.run_number }}
          make_latest: true
          files: shark-bounce/SharkBounce.apk
          body: |
            Download **SharkBounce.apk** below on your Android phone, open it, and allow
            "Install unknown apps" for your browser when asked. Works on Android 5.0+.
