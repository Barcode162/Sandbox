# On every push: the engine's checks, the house built into site/, and the
# house's smoke test in a software browser. On main (and on Sandbox's
# hearthwake branch, its home for now) the site is published to the
# gh-pages branch first, which GitHub Pages serves; the smoke test runs after.
name: Build and publish
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
env:
  EMSDK_VERSION: 6.0.13
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emscripten (cached)
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-v1
      - name: Install Emscripten and Ninja
        run: |
          if [ ! -d emsdk ]; then git clone --depth 1 https://github.com/emscripten-core/emsdk.git; fi
          ./emsdk/emsdk install $EMSDK_VERSION
          ./emsdk/emsdk activate $EMSDK_VERSION
          sudo apt-get install -y ninja-build >/dev/null
      - name: Engine check
        run: |
          source ./emsdk/emsdk_env.sh
          bash engine/test.sh
      - name: Build the house
        run: |
          source ./emsdk/emsdk_env.sh
          bash house/build.sh
      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/hearthwake'
        # gh-pages also serves other Sandbox sites in their own folders (bent-light/, constellation/).
        # Replace only the entries Hearthwake builds into site/, never force-push, and retry if the
        # branch moved meanwhile (another site published).
        run: |
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            rm -rf pub
            if ! git clone -q --depth 1 --branch gh-pages "$url" pub; then
              mkdir pub && git -C pub init -q -b gh-pages
            fi
            for entry in site/* site/.[!.]*; do
              [ -e "$entry" ] || continue
              rm -rf "pub/$(basename "$entry")"
              cp -R "$entry" pub/
            done
            git -C pub add -A
            if git -C pub diff --cached --quiet; then echo "gh-pages already up to date"; exit 0; fi
            git -C pub commit -q -m "Hearthwake, built from ${GITHUB_SHA::7}"
            if git -C pub push -q "$url" HEAD:gh-pages; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "gh-pages moved on every attempt; giving up" >&2
          exit 1
      - name: Install Playwright
        run: |
          npm i --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Smoke test (software WebGPU)
        run: node house/tools/smoke.mjs
      - name: Keep the pictures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: build/shots
