# Checks the engine on every push: the lint, the native tests (g++ and
# em++ in node) and every engine source built for the web.
name: Check
on:
  push:
  workflow_dispatch:
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
env:
  EMSDK_VERSION: 6.0.13
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emscripten (cached)
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-v1
      - name: Install Emscripten
        run: |
          if [ ! -d emsdk ]; then git clone --depth 1 https://github.com/emscripten-core/emsdk.git; fi
          ./emsdk/emsdk install $EMSDK_VERSION
          ./emsdk/emsdk activate $EMSDK_VERSION
      - name: Engine check
        run: |
          source ./emsdk/emsdk_env.sh
          bash engine/test.sh
