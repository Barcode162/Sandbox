<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#2F8F9D" />
    <meta name="description" content="Lilyfield: hop pad to pad across the pond before the gator catches you." />
    <title>Lilyfield</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #2F8F9D; overscroll-behavior: none; }
      body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
      #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #ui { position: fixed; inset: 0; pointer-events: none; touch-action: none; }
      noscript { position: fixed; inset: 0; display: grid; place-items: center; font: 600 18px system-ui, sans-serif; color: #1D2B3A; }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="Lilyfield: hop across the pond"></canvas>
    <div id="ui"></div>
    <noscript>Lilyfield needs JavaScript to hop.</noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
